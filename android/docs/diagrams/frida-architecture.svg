<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1070" viewBox="0 0 680 1070" role="img">
<title>Where Frida runs in Open Voyah Controls</title>
<desc>A one-time PC setup prepares the head unit. The OEM boot script runs as root and starts the authenticated local root channel and the boot worker. The Controls app deploys files through that channel. A supervisor runs the Frida injector as root, which loads the JavaScript agents into the launcher and system_server. Vehicle commands from the launcher reach the car through the stock CAN service.</desc>
