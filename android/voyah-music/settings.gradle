pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        exclusiveContent {
            forRepository { mavenCentral() }
            filter { includeGroup 'com.google.zxing' }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = 'VoyahMusic'
include ':shared', ':player', ':transfer'
