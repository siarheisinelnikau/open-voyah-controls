plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingVariables = [
    store: 'OPEN_VOYAH_RELEASE_KEYSTORE',
    storePassword: 'OPEN_VOYAH_RELEASE_STORE_PASSWORD',
    alias: 'OPEN_VOYAH_RELEASE_KEY_ALIAS',
    keyPassword: 'OPEN_VOYAH_RELEASE_KEY_PASSWORD',
    certificate: 'OPEN_VOYAH_RELEASE_CERT_SHA256',
]
def releaseSigner = signingVariables.collectEntries { name, variable ->
    [(name): providers.environmentVariable(variable).getOrNull()]
}
def signingReady = releaseSigner.values().every { it != null && !it.isEmpty() }
def releasePin = releaseSigner.certificate?.toLowerCase(Locale.ROOT)
def validReleasePin = releasePin != null && (releasePin ==~ /[0-9a-f]{64}/)
def emulatorFixture = providers.gradleProperty('ovc.emulatorFixture').getOrElse('false') == 'true'
def runtimeAssets = layout.buildDirectory.dir('generated/runtime-assets')
def bundledSpeechAssets = layout.buildDirectory.dir('generated/bundled-speech-assets')
def sherpaAar = rootProject.file('dist/sherpa-onnx-2.0.2.aar')
def stageBundledVoiceModel = tasks.register('stageBundledVoiceModel', Exec) {
    description = 'Stage the pinned Zipformer model and sherpa-onnx Android runtime.'
    workingDir rootProject.projectDir
    inputs.file(rootProject.file('tools/prepare_voice_model.py'))
    outputs.dir(bundledSpeechAssets)
    outputs.file(sherpaAar)
    def command = ['python', 'tools/prepare_voice_model.py', '--assets', bundledSpeechAssets.get().asFile.absolutePath]
    if (gradle.startParameter.offline) command += '--offline'
    commandLine command
}
// Text overlays for the 32-bit factory apps (docs/FIRMWARE.md, "Resource overlays for 32-bit apps"). The device script
// is always bundled; the overlay APKs only when the build is pointed at decoded copies of the factory APKs
// (ovc.oemResources) and the APKs themselves (ovc.oemApks). ovc.overlayFingerprint and ovc.overlayBuildDate pin them to
// one firmware build; ovc.overlayLocale is the system language whose texts they replace (ru on the owner's 97C).
def oemResourcesPath = providers.gradleProperty('ovc.oemResources').getOrElse('')
def oemApksPath = providers.gradleProperty('ovc.oemApks').getOrElse('')
def overlayFingerprint = providers.gradleProperty('ovc.overlayFingerprint').getOrElse('')
def overlayBuildDate = providers.gradleProperty('ovc.overlayBuildDate').getOrElse('')
def overlayLocale = providers.gradleProperty('ovc.overlayLocale').getOrElse('ru')
def textOverlayScript = layout.buildDirectory.dir('generated/text-overlay-script')
def textOverlayApks = layout.buildDirectory.dir('generated/text-overlay-apks')
if (!oemResourcesPath.isEmpty() && oemApksPath.isEmpty()) throw new GradleException('ovc.oemResources needs ovc.oemApks.')
// Overlays in the APK are always pinned to one firmware build: an unpinned set could be paired with another build of
// the factory apps after a firmware update.
if (!oemResourcesPath.isEmpty() && (overlayFingerprint.isEmpty() || overlayBuildDate.isEmpty())) {
    throw new GradleException('ovc.oemResources needs ovc.overlayFingerprint and ovc.overlayBuildDate.')
}
// A debug build for one owner's head unit: the review rows and the expected Controls signer come from a folder
// outside the repository (verified-firmware.tsv, verified-operations.tsv, signer.sha256). Release builds ignore it.
def localVehiclePath = providers.gradleProperty('ovc.localVehicle').getOrElse('')
def localVehicleDir = localVehiclePath.isEmpty() ? null : file(localVehiclePath)
def localSigner = ''
if (localVehicleDir != null) {
    if (emulatorFixture) throw new GradleException('ovc.localVehicle and ovc.emulatorFixture cannot be combined.')
    ['verified-firmware.tsv', 'verified-operations.tsv', 'signer.sha256'].each {
        if (!new File(localVehicleDir, it).isFile()) throw new GradleException("ovc.localVehicle needs $it.")
    }
    localSigner = new File(localVehicleDir, 'signer.sha256').text.trim().toLowerCase(Locale.ROOT)
    if (!(localSigner ==~ /[0-9a-f]{64}/)) throw new GradleException('signer.sha256 must contain 64 hexadecimal digits.')
}
// The voice-command approvals the launcher agent is compiled with, written by tools/voice-approvals.mjs. A local-vehicle
// folder may add the owner's own rows in an optional verified-commands.json; only commands confirmed on that car belong
// there. The agent bundle cannot tell a debug build from a release one, so such a build is never packaged as release.
def voiceApprovals = layout.buildDirectory.dir('generated/voice-approvals')
def localVoiceApprovals = localVehicleDir == null ? null : new File(localVehicleDir, 'verified-commands.json')
if (localVoiceApprovals != null && !localVoiceApprovals.isFile()) localVoiceApprovals = null
// The owner's overlay sets, built once on the PC for that car's firmware (tools/build_text_overlays.py with
// --target-apks, --require-fingerprint and --require-build-date) and kept as <local-vehicle>/text-overlays/<language>/.
// A debug build for that car carries them, so Settings → Factory apps language works without the decoded factory APKs.
def localTextOverlays = localVehicleDir == null ? null : new File(localVehicleDir, 'text-overlays')
if (localTextOverlays != null && !localTextOverlays.isDirectory()) localTextOverlays = null
if (localTextOverlays != null && !oemResourcesPath.isEmpty()) {
    throw new GradleException('Use either ovc.oemResources or <local-vehicle>/text-overlays, not both.')
}
if (localTextOverlays != null) {
    localTextOverlays.listFiles().findAll { it.isDirectory() }.each { language ->
        def table = new File(language, 'overlays.tsv')
        // An unpinned table (an older build_text_overlays.py) is refused here, not only later on the head unit.
        if (!table.isFile() || !(table.readLines().find { !it.isBlank() } ?: '').startsWith('pin ')) {
            throw new GradleException("$table must start with a \"pin\" line; rebuild the set with --require-fingerprint and --require-build-date.")
        }
    }
}
def localTextOverlayApks = layout.buildDirectory.dir('generated/local-text-overlays')

// Short commit of the tree the APK was built from, with "+" when tracked files had uncommitted changes.
def gitOutput = { List<String> arguments ->
    try {
        providers.exec {
            commandLine(['git'] + arguments)
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        ''
    }
}
def gitHead = gitOutput(['rev-parse', '--short=8', 'HEAD'])
def gitCommit = !gitHead.matches('[0-9a-f]{7,40}') ? '' :
    gitHead + (gitOutput(['status', '--porcelain', '--untracked-files=no']).isEmpty() ? '' : '+')

android {
    namespace 'org.openvoyah.controls'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.car', false
    defaultConfig {
        applicationId 'org.openvoyah.controls'
        minSdk 28
        targetSdk 35
        versionCode 24
        versionName '0.20.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        buildConfigField 'String', 'RELEASE_CERT_SHA256', '"' + (validReleasePin ? releasePin : '') + '"'
        buildConfigField 'boolean', 'OVC_EMULATOR_FIXTURE', 'false'
        buildConfigField 'boolean', 'LOCAL_VEHICLE', 'false'
        buildConfigField 'String', 'LOCAL_SIGNER_SHA256', '""'
        // Shown with the version at the end of Settings for bug reports; empty when git is unavailable.
        buildConfigField 'String', 'GIT_COMMIT', '"' + gitCommit + '"'
    }
    signingConfigs {
        if (signingReady && validReleasePin) {
            production {
                storeFile = file(releaseSigner.store)
                storePassword = releaseSigner.storePassword
                keyAlias = releaseSigner.alias
                keyPassword = releaseSigner.keyPassword
            }
        }
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    sourceSets.main.assets.srcDir(runtimeAssets)
    sourceSets.main.assets.srcDir(bundledSpeechAssets)
    // Worktrees prepared for older versions can still have the unpacked Vosk assets locally.
    androidResources {
        ignoreAssetsPatterns.addAll(['!.svn', '!.git', '!.ds_store', '!*.scc', '.*', '<dir>_*',
            '!CVS', '!thumbs.db', '!picasa.ini', '!*~', '<dir>speech-model-ru', '<dir>speech-model-en'])
    }
    sourceSets.main.assets.srcDir(textOverlayScript)
    if (!oemResourcesPath.isEmpty()) sourceSets.main.assets.srcDir(textOverlayApks)
    if (localTextOverlays != null) sourceSets.debug.assets.srcDir(localTextOverlayApks)
    // Overrides voice/verified-commands.json from main with the merged catalog, for the app side of the same rows.
    if (localVoiceApprovals != null) sourceSets.debug.assets.srcDir(voiceApprovals)
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'OVC_EMULATOR_FIXTURE', emulatorFixture.toString()
            buildConfigField 'boolean', 'LOCAL_VEHICLE', (localVehicleDir != null).toString()
            buildConfigField 'String', 'LOCAL_SIGNER_SHA256', '"' + localSigner + '"'
        }
        release {
            minifyEnabled false
            if (signingReady && validReleasePin) signingConfig signingConfigs.production
        }
    }
    lint { abortOnError true }
}
kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

android {
    packaging {
        jniLibs {
            // The Zipformer runs on the arm64 head unit only; other ABIs keep Vosk. The JNI library needs only
            // onnxruntime, not the C and C++ APIs that the AAR also carries for other languages.
            excludes += ['lib/*/libsherpa-onnx-c-api.so', 'lib/*/libsherpa-onnx-cxx-api.so',
                         'lib/armeabi-v7a/libonnxruntime.so', 'lib/armeabi-v7a/libsherpa-onnx-jni.so',
                         'lib/x86/libonnxruntime.so', 'lib/x86/libsherpa-onnx-jni.so',
                         'lib/x86_64/libonnxruntime.so', 'lib/x86_64/libsherpa-onnx-jni.so']
        }
    }
}

dependencies {
    implementation files(sherpaAar).builtBy(stageBundledVoiceModel)
    implementation project(':core')
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Check that the private release key matches the configured public certificate pin.'
    doLast {
        if (!signingReady) {
            def missing = signingVariables.findAll { name, variable -> !releaseSigner[name] }.values()
            throw new GradleException('Release signing requires ' + missing.join(', ') + '.')
        }
        if (!validReleasePin) {
            throw new GradleException('OPEN_VOYAH_RELEASE_CERT_SHA256 must contain 64 hexadecimal digits.')
        }
        java.security.KeyStore keystore
        try {
            keystore = java.security.KeyStore.getInstance(file(releaseSigner.store), releaseSigner.storePassword.toCharArray())
        } catch (Exception ignored) {
            throw new GradleException('Could not open the release keystore with the supplied credentials.')
        }
        def certificate = keystore.getCertificate(releaseSigner.alias)
        if (!keystore.isKeyEntry(releaseSigner.alias) || certificate == null) {
            throw new GradleException('The release alias must refer to a private key.')
        }
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (actual != releasePin) {
            throw new GradleException('The release certificate does not match OPEN_VOYAH_RELEASE_CERT_SHA256.')
        }
        try {
            if (!(keystore.getKey(releaseSigner.alias, releaseSigner.keyPassword.toCharArray()) instanceof java.security.PrivateKey)) {
                throw new GradleException('The release alias does not provide a signing key.')
            }
        } catch (java.security.GeneralSecurityException ignored) {
            throw new GradleException('Could not unlock the release key with the supplied credentials.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn verifyReleaseSigning }

tasks.register('compileFridaHook', Exec) {
    workingDir rootProject.projectDir
    commandLine(System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm', 'run', 'build:hook')
    inputs.files(rootProject.fileTree('hooks'), rootProject.file('package-lock.json'), rootProject.file('package.json'),
        rootProject.file('app/src/main/assets/voice/verified-commands.json'), rootProject.file('tools/voice-approvals.mjs'))
    inputs.property('localVoiceApprovals', localVoiceApprovals?.absolutePath ?: '')
    if (localVoiceApprovals != null) inputs.file(localVoiceApprovals)
    // Set even when empty, so a variable left in the shell cannot add rows to an ordinary build.
    environment('OVC_LOCAL_VOICE_APPROVALS', localVoiceApprovals?.absolutePath ?: '')
    outputs.files('src/main/assets/hooks/launcher-buttons.bundle.js', 'src/main/assets/hooks/localization.bundle.js',
        'src/main/assets/hooks/window.bundle.js', 'src/main/assets/hooks/navigation.bundle.js',
        'src/main/assets/hooks/can.bundle.js', 'src/main/assets/hooks/oversea-profiles.bundle.js')
    outputs.dir(voiceApprovals)
}
gradle.taskGraph.whenReady { graph ->
    if (localVoiceApprovals != null && graph.allTasks.any { it.project == project && it.name ==~ /(package|bundle)Release/ }) {
        throw new GradleException('A local-vehicle verified-commands.json is for debug builds only. Build release without ovc.localVehicle.')
    }
}
def stageRuntimeMetadata = tasks.register('stageRuntimeMetadata', Sync) {
    from(rootProject.file('dist/FRIDA_RUNTIME.json')) { into 'production' }
    if (localVehicleDir != null) {
        from(localVehicleDir) { include 'verified-firmware.tsv', 'verified-operations.tsv'; into 'production/local' }
    }
    into runtimeAssets
}
def stageTextOverlayScript = tasks.register('stageTextOverlayScript', Sync) {
    from(rootProject.file('tools/text-overlays.sh')) { into 'text-overlays' }
    into textOverlayScript
}
def buildTextOverlays = tasks.register('buildTextOverlays', Exec) {
    description = 'Build the text overlays for every bundled dictionary from decoded factory APKs.'
    onlyIf { !oemResourcesPath.isEmpty() }
    workingDir rootProject.projectDir
    inputs.files(rootProject.fileTree('hooks/localization'), rootProject.file('tools/build_text_overlays.py'))
    inputs.property('overlayOptions', [overlayFingerprint, overlayBuildDate, overlayLocale])
    // The factory APK copies decide what the decoded resources hold; a changed APK rebuilds the overlays.
    if (!oemApksPath.isEmpty()) inputs.files(fileTree(oemApksPath) { include '*.apk' })
    if (!oemResourcesPath.isEmpty()) inputs.files(fileTree(oemResourcesPath) { include '*/res/values*/*.xml' })
    outputs.dir textOverlayApks
    doFirst { delete textOverlayApks }
    def command = ['python', '-I', 'tools/build_text_overlays.py', oemResourcesPath, '--language', 'all',
        '--locale', overlayLocale, '--target-apks', oemApksPath,
        '--out', textOverlayApks.get().dir('text-overlays').asFile.absolutePath,
        '--sources', layout.buildDirectory.dir('text-overlay-sources').get().asFile.absolutePath,
        '--sdk', android.sdkDirectory.absolutePath]
    if (!overlayFingerprint.isEmpty()) command += ['--require-fingerprint', overlayFingerprint, '--require-build-date', overlayBuildDate]
    commandLine command
}
def stageLocalTextOverlays = tasks.register('stageLocalTextOverlays', Sync) {
    description = 'Copy the owner\'s prebuilt text overlays from the local-vehicle folder (debug builds for that car).'
    if (localTextOverlays != null) from(localTextOverlays) { include '*/overlays.tsv', '*/*.apk'; into 'text-overlays' }
    into localTextOverlayApks
}
tasks.named('preBuild').configure {
    dependsOn 'compileFridaHook', stageRuntimeMetadata, stageBundledVoiceModel, stageTextOverlayScript, buildTextOverlays,
        stageLocalTextOverlays
}
