[package]
name = "open-voyah-controls-installer"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Windows installer and maintenance console for Open Voyah Controls"

[[bin]]
name = "OpenVoyahControlsInstaller"
path = "src/main.rs"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.5", features = ["json"] }
zip = { version = "4.6", default-features = false }

[target.'cfg(windows)'.dependencies]
png = "0.18"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com",
  "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Time",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
