<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1504" viewBox="0 0 680 1504" role="img">
<title>How the Windows installer sets up a head unit</title>
<desc>The installer has four install buttons. Prepare and install checks the APK and injector on the PC, gets ADB root, backs up the OEM boot script to the PC, makes /system writable, pauses an older deployment, installs the signed Controls APK, stages the Frida injector, rearms, installs the root channel and the V3 boot entry, and runs the first-run check. The app then deploys its agents into /data/adb/open-voyah-controls through the root channel. When a YouTube app APK is selected, it is installed last as a separate step with its own certificate pin. Any Controls update revokes boot activation until Prepare and install runs again; installing the YouTube app does not.</desc>
<style>
