<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1060" viewBox="0 0 680 1060" role="img">
<title>How the Windows installer sets up a head unit</title>
<desc>Install on the Installation page runs one cycle of twelve steps. The PC first checks the APK certificate: the pinned release certificate, or an owner certificate the user trusted on this PC or listed in local-vehicle signer.sha256; an unknown certificate is shown with its SHA-256 and needs the user's confirmation. Then ADB root and startup checks, a PC backup of the boot script, a writable system partition, a rollback of an earlier deployment with restart 1 when its visuals need it, the app install, the Frida injector and rearm, the root channel, the V3 startup entry, the first-run check in the app, restart 2, and a final check that the agents started by themselves. Any failure stops in a safe state with Retry and Roll back. The Other apps page installs, lists, opens, grants, exports and uninstalls other apps without touching Controls.</desc>
<style>
svg { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.bg { fill: #FFFFFF; }
.outer { fill: none; stroke: #888780; stroke-width: 1; }
.head { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
.cap { font-size: 12px; fill: #5F5E5A; }
.pr { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; }
.pt { font-size: 14px; font-weight: 600; fill: #3C3489; }
.ps { font-size: 12px; fill: #534AB7; }
.tr { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
.tt { font-size: 14px; font-weight: 600; fill: #085041; }
.tsub { font-size: 12px; fill: #0F6E56; }
.cr { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; }
.ct { font-size: 14px; font-weight: 600; fill: #712B13; }
.cs { font-size: 12px; fill: #993C1D; }
.gr { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; }
.gt { font-size: 14px; font-weight: 600; fill: #444441; }
.gs { font-size: 12px; fill: #5F5E5A; }
.nr { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.75; }
.dash { stroke-dasharray: 4 4; }
.arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
.link { fill: none; stroke: #B4B2A9; stroke-width: 1; }
.mk { fill: none; stroke: #5F5E5A; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #2C2C2A; }
  .outer { stroke: #888780; }
  .head { fill: #F1EFE8; }
  .cap { fill: #B4B2A9; }
  .pr { fill: #3C3489; stroke: #AFA9EC; }
  .pt { fill: #CECBF6; }
  .ps { fill: #AFA9EC; }
  .tr { fill: #085041; stroke: #5DCAA5; }
  .tt { fill: #9FE1CB; }
  .tsub { fill: #5DCAA5; }
  .cr { fill: #712B13; stroke: #F0997B; }
  .ct { fill: #F5C4B3; }
  .cs { fill: #F0997B; }
  .gr { fill: #444441; stroke: #B4B2A9; }
  .gt { fill: #D3D1C7; }
  .gs { fill: #B4B2A9; }
  .nr { fill: #444441; stroke: #888780; }
  .link { stroke: #888780; }
  .arr, .mk { stroke: #B4B2A9; }
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="1060"/>

<rect class="outer" x="20" y="20" width="640" height="150" rx="20"/>
<text class="head" x="40" y="42" dominant-baseline="central">PC · Installation page: choose the APK, select Install</text>
<text class="cap" x="40" y="62" dominant-baseline="central">Pressing Install is the approval for the whole cycle, including both restarts.</text>
<rect class="pr" x="40" y="80" width="180" height="70" rx="6"/>
<text class="pt" x="130" y="98" text-anchor="middle" dominant-baseline="central">Release build</text>
<text class="ps" x="130" y="118" text-anchor="middle" dominant-baseline="central">pinned release certificate,</text>
<text class="ps" x="130" y="134" text-anchor="middle" dominant-baseline="central">non-debuggable</text>
<rect class="pr" x="250" y="80" width="180" height="70" rx="6"/>
<text class="pt" x="340" y="98" text-anchor="middle" dominant-baseline="central">Owner build</text>
<text class="ps" x="340" y="118" text-anchor="middle" dominant-baseline="central">certificate trusted on this PC</text>
<text class="ps" x="340" y="134" text-anchor="middle" dominant-baseline="central">or local-vehicle/signer.sha256</text>
<rect class="nr dash" x="460" y="80" width="180" height="70" rx="6"/>
<text class="gt" x="550" y="98" text-anchor="middle" dominant-baseline="central">Unknown certificate</text>
<text class="gs" x="550" y="118" text-anchor="middle" dominant-baseline="central">shown with its SHA-256;</text>
<text class="gs" x="550" y="134" text-anchor="middle" dominant-baseline="central">Yes trusts it, No stops</text>
<path class="link" d="M460 115 L430 115" marker-end="url(#a)"/>

<path class="arr" d="M250 170 L250 196" marker-end="url(#a)"/>

<rect class="outer" x="20" y="200" width="640" height="660" rx="20"/>
<text class="head" x="40" y="222" dominant-baseline="central">One cycle over ADB, twelve steps</text>

<rect class="pr" x="40" y="240" width="420" height="42" rx="6"/>
<text class="pt" x="54" y="254" dominant-baseline="central">1  Check the APK and the head unit</text>
<text class="ps" x="54" y="271" dominant-baseline="central">package, certificate, injector digest, user 0, SDK, SELinux</text>

<rect class="tr" x="40" y="290" width="420" height="42" rx="6"/>
<text class="tt" x="54" y="304" dominant-baseline="central">2  ADB root and startup checks</text>
<text class="tsub" x="54" y="321" dominant-baseline="central">BusyBox Telnet and the root init service of init.logcat.sh</text>

<rect class="pr" x="40" y="340" width="420" height="42" rx="6"/>
<text class="pt" x="54" y="354" dominant-baseline="central">3  Back up the startup script to this PC</text>
<text class="ps" x="54" y="371" dominant-baseline="central">backups\boot-backup-&lt;time&gt; under the installer's folder</text>

<rect class="tr" x="40" y="390" width="420" height="42" rx="6"/>
<text class="tt" x="54" y="404" dominant-baseline="central">4  Writable system partition</text>
<text class="tsub" x="54" y="421" dominant-baseline="central">adb remount; a first setup may restart once for verified boot</text>

<rect class="cr" x="40" y="440" width="420" height="42" rx="6"/>
<text class="ct" x="54" y="454" dominant-baseline="central">5  Pause the previous installation</text>
<text class="cs" x="54" y="471" dominant-baseline="central">rollback; restart 1 when visuals need it, then adb root again</text>

<rect class="tr" x="40" y="490" width="420" height="42" rx="6"/>
<text class="tt" x="54" y="504" dominant-baseline="central">6  Install the app</text>
<text class="tsub" x="54" y="521" dominant-baseline="central">adb install -r --user 0, installed bytes checked</text>

<rect class="tr" x="40" y="540" width="420" height="42" rx="6"/>
<text class="tt" x="54" y="554" dominant-baseline="central">7  Frida injector and activation</text>
<text class="tsub" x="54" y="571" dominant-baseline="central">pinned injector staged; rearm on a reviewed firmware</text>

<rect class="tr" x="40" y="590" width="420" height="42" rx="6"/>
<text class="tt" x="54" y="604" dominant-baseline="central">8  Root channel and permissions</text>
<text class="tsub" x="54" y="621" dominant-baseline="central">127.0.0.1:2323 Telnet, microphone, button service</text>

<rect class="tr" x="40" y="640" width="420" height="42" rx="6"/>
<text class="tt" x="54" y="654" dominant-baseline="central">9  Startup entry</text>
<text class="tsub" x="54" y="671" dominant-baseline="central">V3 entry in /system/etc/init.logcat.sh</text>

<rect class="gr" x="40" y="690" width="420" height="42" rx="6"/>
<text class="gt" x="54" y="704" dominant-baseline="central">10  First-run check in the app</text>
<text class="gs" x="54" y="721" dominant-baseline="central">the app deploys its agents; a late answer waits for them</text>

<rect class="cr" x="40" y="740" width="420" height="42" rx="6"/>
<text class="ct" x="54" y="754" dominant-baseline="central">11  Restart the head unit</text>
<text class="cs" x="54" y="771" dominant-baseline="central">restart 2; wait for the same unit to boot, adb root again</text>

<rect class="gr" x="40" y="790" width="420" height="42" rx="6"/>
<text class="gt" x="54" y="804" dominant-baseline="central">12  Agents started by themselves</text>
<text class="gs" x="54" y="821" dominant-baseline="central">entry present, root channel active, launcher ready (5 min)</text>

<rect class="nr dash" x="480" y="240" width="160" height="92" rx="6"/>
<text class="gt" x="560" y="258" text-anchor="middle" dominant-baseline="central">Already running</text>
<text class="gs" x="560" y="278" text-anchor="middle" dominant-baseline="central">same APK and ready</text>
<text class="gs" x="560" y="294" text-anchor="middle" dominant-baseline="central">agents after step 2:</text>
<text class="gs" x="560" y="310" text-anchor="middle" dominant-baseline="central">nothing changes</text>
<path class="link" d="M480 311 L460 311" marker-end="url(#a)"/>

<rect class="cr" x="480" y="440" width="160" height="290" rx="6"/>
<text class="ct" x="560" y="460" text-anchor="middle" dominant-baseline="central">On any failure</text>
<text class="cs" x="560" y="486" text-anchor="middle" dominant-baseline="central">the cycle stops</text>
<text class="cs" x="560" y="502" text-anchor="middle" dominant-baseline="central">in a safe state and</text>
<text class="cs" x="560" y="518" text-anchor="middle" dominant-baseline="central">names the step</text>
<text class="ct" x="560" y="552" text-anchor="middle" dominant-baseline="central">Retry</text>
<text class="cs" x="560" y="572" text-anchor="middle" dominant-baseline="central">runs it again; every</text>
<text class="cs" x="560" y="588" text-anchor="middle" dominant-baseline="central">step checks the state</text>
<text class="cs" x="560" y="604" text-anchor="middle" dominant-baseline="central">first</text>
<text class="ct" x="560" y="638" text-anchor="middle" dominant-baseline="central">Roll back</text>
<text class="cs" x="560" y="658" text-anchor="middle" dominant-baseline="central">restores the original</text>
<text class="cs" x="560" y="674" text-anchor="middle" dominant-baseline="central">startup script, with a</text>
<text class="cs" x="560" y="690" text-anchor="middle" dominant-baseline="central">restart when needed;</text>
<text class="cs" x="560" y="706" text-anchor="middle" dominant-baseline="central">app data stays</text>

<rect class="pr" x="40" y="842" width="12" height="10" rx="2"/>
<text class="cap" x="58" y="847" dominant-baseline="central">PC only</text>
<rect class="tr" x="128" y="842" width="12" height="10" rx="2"/>
<text class="cap" x="146" y="847" dominant-baseline="central">changes the head unit</text>
<rect class="cr" x="290" y="842" width="12" height="10" rx="2"/>
<text class="cap" x="308" y="847" dominant-baseline="central">restart</text>
<rect class="gr" x="368" y="842" width="12" height="10" rx="2"/>
<text class="cap" x="386" y="847" dominant-baseline="central">check</text>

<rect class="outer" x="20" y="880" width="640" height="160" rx="20"/>
<text class="head" x="40" y="902" dominant-baseline="central">Other apps page</text>
<rect class="tr" x="40" y="920" width="290" height="100" rx="6"/>
<text class="tt" x="54" y="940" dominant-baseline="central">Drop or choose APKs</text>
<text class="tsub" x="54" y="962" dominant-baseline="central">install or update with adb install -r;</text>
<text class="tsub" x="54" y="980" dominant-baseline="central">Controls, OEM and split APKs are refused</text>
<text class="tsub" x="54" y="998" dominant-baseline="central">before the first install</text>
<rect class="gr" x="350" y="920" width="290" height="100" rx="6"/>
<text class="gt" x="364" y="940" dominant-baseline="central">Installed apps with versions</text>
<text class="gs" x="364" y="962" dominant-baseline="central">open, grant runtime permissions,</text>
<text class="gs" x="364" y="980" dominant-baseline="central">export APK, uninstall. The Controls</text>
<text class="gs" x="364" y="998" dominant-baseline="central">package, runtime and entry stay as they are</text>
</svg>
